[project]
name = "lunar"
version = "0.1.0"
description = "UPR robot CLI for simulation + visualization"
readme = "README.md"
requires-python = ">=3.8.1,<3.9"
dependencies = [
  "typer>=0.12.3",
  "tomli>=2.0.1",
  "streamlit>=1.30.0",
  "pandas>=2.0.0",
  "opencv-python-headless>=4.8.0",
  "psutil>=5.9.0",
  "matplotlib>=3.7.0",
  "plotly>=5.15.0",
  "pyserial>=3.5",
  "empy==3.3.4",
  "catkin_pkg",
  "lark",
  "PyYAML",
  "netifaces",
  "textual==0.86.3",
]

[project.scripts]
lunar = "lunar.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
